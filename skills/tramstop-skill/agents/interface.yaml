interface:
  display_name: "Tramstop Skill"
  short_description: "电车站.skill：证据驱动的去 AI 味实证方法论，四层病灶诊断与真实经验素材注入"
  default_prompt: "使用 $tramstop-skill 诊断文稿中的 AI 味分层，并进行结构手术与真实经验注入。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
