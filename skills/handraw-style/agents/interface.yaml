interface:
  display_name: "手绘风格提示词"
  short_description: "手绘风格与排版提示词库：277 种插画风格/119 种排版图型/30 种主题色生图引擎"
  default_prompt: "使用 $handraw-style 输出手绘风格提示词或搭配海报与版式设计。"
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
    - "vscode"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
    vscode: "agent-skills-source-with-vscode-notes"
